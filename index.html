<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Sensor AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&family=Fira+Code:wght@400;500&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
        .code-font { font-family: 'Fira Code', monospace; }
        .pulse { animation: pulse-animation 1.5s infinite; }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0px rgba(59, 130, 246, 0.7); }
            100% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
        }
        .message-bubble { border-radius: 1rem; }
        pre { background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.5rem 0; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-700 text-white p-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-microchip"></i> Arduino Sensor Expert
            </h1>
            <div id="status" class="text-sm bg-blue-800 px-3 py-1 rounded-full border border-blue-400">ระบบ AI พร้อมแนะนำโค้ด</div>
        </div>
    </header>

    <main class="flex-grow p-4 md:p-6 max-w-5xl mx-auto w-full grid grid-cols-1 md:grid-cols-4 gap-6">
        
        <!-- Sidebar: Common Sensors -->
        <div class="md:col-span-1 space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <h2 class="font-bold text-gray-700 mb-3 text-sm uppercase tracking-wider">เซนเซอร์ยอดนิยม</h2>
                <div class="flex flex-col gap-2">
                    <button onclick="quickAsk('ขอโค้ด DHT11 วัดอุณหภูมิและความชื้น')" class="text-left p-2 text-xs hover:bg-blue-50 rounded border border-transparent hover:border-blue-200 transition-all">
                        <i class="fas fa-thermometer-half text-blue-500 mr-1"></i> DHT11 (Temp/Hum)
                    </button>
                    <button onclick="quickAsk('ขอโค้ด Ultrasonic HC-SR04 วัดระยะทาง')" class="text-left p-2 text-xs hover:bg-blue-50 rounded border border-transparent hover:border-blue-200 transition-all">
                        <i class="fas fa-ruler text-blue-500 mr-1"></i> Ultrasonic (Distance)
                    </button>
                    <button onclick="quickAsk('ขอโค้ด LDR Sensor เปิดปิดไฟอัตโนมัติ')" class="text-left p-2 text-xs hover:bg-blue-50 rounded border border-transparent hover:border-blue-200 transition-all">
                        <i class="fas fa-lightbulb text-blue-500 mr-1"></i> LDR (Light)
                    </button>
                    <button onclick="quickAsk('ขอโค้ด Soil Moisture วัดความชื้นในดิน')" class="text-left p-2 text-xs hover:bg-blue-50 rounded border border-transparent hover:border-blue-200 transition-all">
                        <i class="fas fa-tint text-blue-500 mr-1"></i> Soil Moisture
                    </button>
                    <button onclick="quickAsk('ขอโค้ด PIR Sensor ตรวจจับความเคลื่อนไหว')" class="text-left p-2 text-xs hover:bg-blue-50 rounded border border-transparent hover:border-blue-200 transition-all">
                        <i class="fas fa-running text-blue-500 mr-1"></i> PIR Motion
                    </button>
                </div>
            </div>
        </div>

        <!-- Chat Main Area -->
        <div class="md:col-span-3 flex flex-col h-[75vh]">
            <div id="chat-window" class="flex-grow p-4 overflow-y-auto space-y-4 bg-white rounded-t-2xl border border-gray-200 shadow-sm">
                <!-- Bot Welcome -->
                <div class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 shrink-0">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="bg-gray-50 border border-gray-200 p-4 message-bubble shadow-sm max-w-[90%] text-gray-700 text-sm leading-relaxed">
                        สวัสดีครับ! ผมคือผู้ช่วยสำหรับผู้ใช้ **Arduino** <br>
                        ผมสามารถเขียนโค้ดควบคุม Sensor, อธิบายการต่อวงจร และแก้ปัญหา Error ได้ครับ <br><br>
                        ลองกด **ปุ่มไมโครโฟน** แล้วพูดว่า <i>"ขอโค้ดวัดระยะทางด้วย Ultrasonic"</i> ดูสิครับ
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-4 border-x border-b border-gray-200 bg-gray-50 rounded-b-2xl">
                <div class="flex gap-2 items-center bg-white rounded-full px-4 py-2 shadow-inner border border-gray-200">
                    <input type="text" id="user-input" placeholder="พิมพ์ชื่อ Sensor หรือคำสั่งที่ต้องการ..." 
                        class="bg-transparent flex-grow outline-none text-gray-700 py-1 text-sm">
                    
                    <button id="mic-btn" class="w-10 h-10 flex items-center justify-center rounded-full transition-all hover:bg-gray-100 text-gray-400" title="สั่งงานด้วยเสียง">
                        <i class="fas fa-microphone text-lg"></i>
                    </button>
                    
                    <button id="send-btn" class="w-10 h-10 flex items-center justify-center rounded-full bg-blue-600 text-white hover:bg-blue-700 transition-all shadow-md">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div id="recording-status" class="hidden text-xs text-center text-blue-600 mt-2 font-medium">
                    <span class="pulse inline-block w-2 h-2 rounded-full bg-blue-500 mr-2"></span> กำลังรับเสียงคำสั่งของคุณ...
                </div>
            </div>
        </div>
    </main>

    <script>
        const apiKey = ""; // Gemini API Key will be handled by the environment

        // Web Speech API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const synth = window.speechSynthesis;
        let recognition;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.continuous = false;

            recognition.onstart = () => {
                isRecording = true;
                document.getElementById('mic-btn').className = 'w-10 h-10 flex items-center justify-center rounded-full bg-red-100 text-red-500 shadow-inner';
                document.getElementById('recording-status').classList.remove('hidden');
            };

            recognition.onend = () => {
                isRecording = false;
                document.getElementById('mic-btn').className = 'w-10 h-10 flex items-center justify-center rounded-full transition-all hover:bg-gray-100 text-gray-400';
                document.getElementById('recording-status').classList.add('hidden');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                sendMessage();
            };
        }

        // Event Listeners
        document.getElementById('mic-btn').addEventListener('click', () => {
            if (!recognition) return alert("Browser ของคุณไม่รองรับ Speech Recognition");
            isRecording ? recognition.stop() : recognition.start();
        });

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function quickAsk(text) {
            document.getElementById('user-input').value = text;
            sendMessage();
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if (!message) return;

            addMessageToChat('user', message);
            inputField.value = '';

            const loadingId = addMessageToChat('ai', '<i class="fas fa-circle-notch fa-spin"></i> กำลังเขียนโค้ดและเตรียมคำอธิบาย...');

            try {
                const responseText = await getAIResponse(message);
                updateMessage(loadingId, responseText);
                speakResponse(responseText);
            } catch (error) {
                updateMessage(loadingId, "ขออภัยครับ เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง");
            }
        }

        function addMessageToChat(role, text) {
            const chatWindow = document.getElementById('chat-window');
            const messageId = Date.now();
            const isAI = role === 'ai';
            
            const div = document.createElement('div');
            div.className = `flex items-start gap-3 ${isAI ? '' : 'flex-row-reverse'}`;
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full ${isAI ? 'bg-blue-100 text-blue-600' : 'bg-green-100 text-green-600'} flex items-center justify-center shrink-0">
                    <i class="fas ${isAI ? 'fa-robot' : 'fa-user'}"></i>
                </div>
                <div id="msg-${messageId}" class="${isAI ? 'bg-gray-50 border border-gray-200' : 'bg-blue-600 text-white'} p-3 message-bubble shadow-sm max-w-[90%] text-sm overflow-x-auto">
                    ${text}
                </div>
            `;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return `msg-${messageId}`;
        }

        function updateMessage(id, text) {
            const el = document.getElementById(id);
            if (!el) return;
            
            // Format Code Blocks
            let formattedText = text
                .replace(/```cpp([\s\S]*?)```/g, '<pre class="code-font">$1</pre>')
                .replace(/```arduino([\s\S]*?)```/g, '<pre class="code-font">$1</pre>')
                .replace(/```([\s\S]*?)```/g, '<pre class="code-font">$1</pre>')
                .replace(/\n/g, '<br>');
            
            el.innerHTML = formattedText;
            document.getElementById('chat-window').scrollTop = document.getElementById('chat-window').scrollHeight;
        }

        function speakResponse(text) {
            if (!synth) return;
            synth.cancel();
            
            // Extract only the explanation part (exclude large code blocks for voice)
            const speechText = text.split('```')[0].replace(/<[^>]*>?/gm, '').substring(0, 200) + "... ตรวจสอบโค้ดฉบับเต็มได้ที่หน้าจอครับ";
            
            const utterance = new SpeechSynthesisUtterance(speechText);
            utterance.lang = 'th-TH';
            const voices = synth.getVoices();
            const thaiVoice = voices.find(v => v.lang.includes('th'));
            if (thaiVoice) utterance.voice = thaiVoice;
            
            synth.speak(utterance);
        }

        async function getAIResponse(userQuery) {
            const systemPrompt = `You are an Arduino Programming Expert. 
            Your goal is to provide C++ code for various sensors (DHT, Ultrasonic, LDR, etc.).
            Always include:
            1. Short Thai explanation of the circuit connection (Pin numbers).
            2. The complete, ready-to-copy Arduino (.ino) code with Thai comments.
            3. A brief explanation of how the code works.
            Format code in triple backticks with 'cpp' language.
            Keep responses helpful and expert-level.`;

            let retries = 0;
            const maxRetries = 5;

            while (retries < maxRetries) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });

                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "ไม่สามารถดึงข้อมูลได้";
                } catch (error) {
                    retries++;
                    if (retries === maxRetries) throw error;
                    await new Promise(res => setTimeout(res, Math.pow(2, retries) * 1000));
                }
            }
        }
    </script>
</body>
</html>
